$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.collectionVariables.set('authToken', body.token);
      pm.collectionVariables.set('userId', body.user.id);
    language: text/javascript
order: 2000
